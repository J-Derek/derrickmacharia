<html lang="en">

    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Derrick Macharia — Software Developer</title>
    <meta name="description" content="Derrick Macharia — Software Developer & Flutter Engineer based in Nairobi, Kenya. Crafting high-performance mobile and web applications with Flutter, React, and modern backend architectures." />
    
    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Derrick Macharia — Software Developer" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:image" content="/workspace.jpg" />

    <meta name="theme-color" content="#080808" />

    <!-- Apply saved theme before first paint to avoid a flash -->
    <script>
      try {
        var t = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.classList.toggle('dark', t === 'dark');
        if (t === 'light') document.querySelector('meta[name="theme-color"]').setAttribute('content', '#f0ede8');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:ital,wght@0,300..500;1,300..500&display=swap" rel="stylesheet">
